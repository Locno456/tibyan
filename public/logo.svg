<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gradAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0%" stop-color="white" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.18"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="1" result="offsetBlur"/>
      <feComposite in="offsetBlur" in2="SourceAlpha" operator="out" result="inverse"/>
      <feFlood flood-color="white" flood-opacity="0.9" result="color"/>
      <feComposite in="color" in2="inverse" operator="in" result="shadow"/>
      <feComposite in="shadow" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <!-- Outer squircle glass base -->
  <g filter="url(#softShadow)">
    <rect x="8" y="8" width="124" height="124" rx="36" fill="url(#gradMain)"/>
    <rect x="8" y="8" width="124" height="124" rx="36" fill="url(#shine)"/>
    <!-- subtle inner border -->
    <rect x="8" y="8" width="124" height="124" rx="36" fill="none" stroke="white" stroke-opacity="0.55" stroke-width="1.2"/>
  </g>
  <!-- Inner white glass card -->
  <g>
    <rect x="28" y="28" width="84" height="84" rx="22" fill="white" fill-opacity="0.92"/>
    <rect x="28" y="28" width="84" height="84" rx="22" fill="none" stroke="white" stroke-width="1.5"/>
  </g>
  <!-- Open book icon - modern -->
  <g transform="translate(70,66)">
    <!-- book shadow -->
    <path d="M-22,10 C-12,5 -3,7 0,12 C3,7 12,5 22,10 L22,-10 C12,-15 3,-13 0,-8 C-3,-13 -12,-15 -22,-10 Z" fill="#EFF6FF" opacity="0.9"/>
    <!-- book stroke -->
    <path d="M-22,8 C-12,3 -3,5 0,10 C3,5 12,3 22,8 L22,-12 C12,-17 3,-15 0,-10 C-3,-15 -12,-17 -22,-12 Z" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M0,-10 L0,10" fill="none" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
    <!-- pages detail -->
    <path d="M-14,-2 C-9,-4 -4,-3 0,0" fill="none" stroke="#94A3B8" stroke-width="1" opacity="0.5"/>
    <path d="M14,-2 C9,-4 4,-3 0,0" fill="none" stroke="#94A3B8" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- AI spark / verification check - purple 3D dot -->
  <g transform="translate(102,28)">
    <circle cx="0" cy="0" r="14" fill="url(#gradAI)" stroke="white" stroke-width="2.2"/>
    <path d="M-5,0 L-1.5,3.5 L5.5,-4" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
