<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0B8"/><stop offset="1" stop-color="#E0B450"/></linearGradient>
<linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A8" stop-opacity="0"/><stop offset=".5" stop-color="#FFD66B" stop-opacity="1"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#FFF8E0" stop-opacity=".95"/><stop offset=".35" stop-color="#FFE7A0" stop-opacity=".45"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient>
<radialGradient id="streak"><stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/><stop offset=".4" stop-color="#9AF4FF" stop-opacity=".7"/><stop offset="1" stop-color="#9AF4FF" stop-opacity="0"/></radialGradient>
<linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="90" y1="270" x2="240" y2="370"><stop offset="0" stop-color="#19D6C4"/><stop offset="1" stop-color="#14529E"/></linearGradient>
<mask id="mk" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><polyline points="150.6,368.9 234,330 98.1,266.6" fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/></mask>
</defs>
<style>
svg *{transform-box:view-box}
.cl{stroke-dasharray:242 400;animation:draw 1s cubic-bezier(.2,.7,.2,1) .2s both}
.cg{transform-origin:234px 330px;animation:rot 1s cubic-bezier(.65,0,.35,1) 2.45s both}
.cm{transform-origin:256px 0;opacity:0;animation:mir .8s cubic-bezier(.6,0,.3,1) 3.65s forwards}
.sw{animation:sw .95s cubic-bezier(.45,.05,.35,1) 1.35s both}
.fl{animation:fpos .95s cubic-bezier(.45,.05,.35,1) 1.35s both}
.fi{opacity:0;transform-origin:0 0;animation:fop .95s linear 1.35s both}
.dp{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.d1{animation-delay:4.65s}.d2{animation-delay:4.8s}
@keyframes draw{from{stroke-dashoffset:242}to{stroke-dashoffset:0}}
@keyframes rot{from{transform:translate(22px,0) scale(1.35) rotate(90deg)}to{transform:none}}
@keyframes mir{from{opacity:1;transform:scaleX(1)}to{opacity:1;transform:scaleX(-1)}}
@keyframes sw{from{transform:translate(0,450px)}to{transform:translate(0,160px)}}
@keyframes fpos{from{transform:translate(94px,238px)}to{transform:translate(485px,238px)}}
@keyframes fop{0%{opacity:0;transform:scale(.3)}28%{opacity:.95;transform:scale(1)}55%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(.4)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
</style>
<g transform="translate(256,256) scale(1.05) translate(-256,-297)">
<g class="cm"><polyline points="150.6,368.9 234,330 98.1,266.6" fill="none" stroke="url(#sg)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="cg">
<polyline class="cl" points="150.6,368.9 234,330 98.1,266.6" fill="none" stroke="url(#sg)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
<g mask="url(#mk)"><g class="sw"><rect x="20" y="-34" width="300" height="68" fill="url(#band)" transform="rotate(-16 170 0)"/></g></g>
</g>
<g transform="translate(221.7 238)"><g class="dp d1"><rect x="-20" y="-20" width="40" height="40" rx="6" fill="url(#gd)" transform="rotate(45)"/></g></g>
<g transform="translate(290.3 238)"><g class="dp d2"><rect x="-20" y="-20" width="40" height="40" rx="6" fill="url(#gd)" transform="rotate(45)"/></g></g>
<g class="fl"><g class="fi" style="mix-blend-mode:screen">
<circle r="58" fill="url(#glow)"/><ellipse rx="150" ry="5" fill="url(#streak)"/><ellipse rx="3.5" ry="40" fill="url(#streak)"/>
</g></g>
</g>
</svg>